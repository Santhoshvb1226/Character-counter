<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 16px;
            border: 1px solid #999;
            border-radius: 5px;
        }

        .limit {
            margin-top: 10px;
            color: #555;
        }

        #counter {
            margin-top: 10px;
            font-weight: bold;
        }

        #warning {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Character Counter</h2>

        <textarea 
            id="message"
            maxlength="200"
            placeholder="Type your message here...">
        </textarea>

        <p class="limit">200 characters max</p>

        <p id="counter">0/200 characters</p>

        <p id="warning"></p>

    </div>

    <script>

        // Get the HTML elements
        const message = document.getElementById("message");
        const counter = document.getElementById("counter");
        const warning = document.getElementById("warning");

        // Maximum character limit
        const maxLength = 200;

        // Listen for typing
        message.addEventListener("input", function() {

            // Count the characters
            const typedCharacters = message.value.length;

            // Calculate remaining characters
            const remainingCharacters = maxLength - typedCharacters;

            // Display counter
            counter.textContent =
                typedCharacters + "/" + maxLength + " characters";

            // Display warning
            if (typedCharacters >= maxLength) {
                warning.textContent = "Warning: Character limit reached!";
            } else {
                warning.textContent = "";
            }

        });

    </script>

</body>
</html>
